name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # On a push to main from a normal PR merge, the images were already built
  # and pushed (tagged pr-<number>) while the PR was open. Figure out which
  # PR this merge commit came from so the build jobs below can be skipped and
  # that same image promoted instead of recompiled.
  resolve-pr:
    name: Resolve merged PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      # Looks the PR up via the API so merge, squash and rebase merges all work.
      # Only reports a PR when the merged tree is identical to the PR head's
      # tree; otherwise (e.g. main moved after the PR was last tested) the
      # pr-<number> image isn't what was merged, so the build jobs run instead.
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          number=""
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] | "\(.number) \(.head.sha)"' 2>/dev/null || true)
          if [[ "$pr" =~ ^([0-9]+)\ ([0-9a-f]{40})$ ]]; then
            merged_tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
            head_tree=$(gh api "repos/$REPO/git/commits/${BASH_REMATCH[2]}" --jq .tree.sha)
            if [[ "$merged_tree" == "$head_tree" ]]; then
              number="${BASH_REMATCH[1]}"
            else
              echo "Merged tree differs from PR head tree; falling back to a fresh build."
            fi
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  docker-backend:
    name: Docker — backend lint, test, build & publish
    needs: [resolve-pr]
    if: always() && (github.event_name == 'pull_request' || needs.resolve-pr.outputs.pr_number == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Also logs in (and later pushes) for same-repo PR branches, so the
      # pr-<number> image exists to promote once the PR merges. Forked PRs
      # never get registry credentials.
      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      # Runs lint + test stages and exports the JUnit report. Cached below, so this
      # doesn't recompile anything the final build step below also needs.
      - name: Lint, test & extract report
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: test-report
          outputs: type=local,dest=./backend/test-output
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/test-output/test-report.xml

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  docker-frontend:
    name: Docker — frontend lint, type-check, build & publish
    needs: [resolve-pr]
    if: always() && (github.event_name == 'pull_request' || needs.resolve-pr.outputs.pr_number == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  promote:
    name: Promote merged PR images to latest/sha tags
    needs: [resolve-pr]
    if: github.event_name == 'push' && needs.resolve-pr.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # No rebuild: repoints the already-tested pr-<number> image (built and
      # pushed while the PR was open) at the latest/sha tags production pulls.
      - name: Promote backend image
        env:
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-backend:latest \
            -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-backend:sha-${GITHUB_SHA::7} \
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-backend:pr-"$PR_NUMBER"

      - name: Promote frontend image
        env:
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-frontend:latest \
            -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-frontend:sha-${GITHUB_SHA::7} \
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-frontend:pr-"$PR_NUMBER"
