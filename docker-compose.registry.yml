# Runs the stack from the images CI publishes to GHCR instead of building
# locally. Same services, ports and volumes as docker-compose.yml, so it shares
# the postgres_data volume with the build-from-source setup.
#
#   docker compose -f docker-compose.registry.yml pull
#   docker compose -f docker-compose.registry.yml up -d
#
# Images are public; `docker login ghcr.io` is only needed if that changes.
# Pin a build with IMAGE_TAG=sha-<short-sha> (see the tags CI pushes).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/max20050/docuwave-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      DATASOURCE_ENCRYPTION_KEY: ${DATASOURCE_ENCRYPTION_KEY}
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY}
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      # Off by default: ai-summary blocks aren't meant to ship until a cost
      # estimator exists. Set AI_SUMMARY_ENABLED=true in .env to turn them on
      # locally.
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/max20050/docuwave-frontend:${IMAGE_TAG:-latest}
    # NEXT_PUBLIC_API_URL is inlined by `next build`, so setting it here has no
    # effect. CI builds without it and lib/api.ts falls back to
    # http://localhost:8080 — the same value docker-compose.yml passes. Talking
    # to a backend on another host means building the image yourself.
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
